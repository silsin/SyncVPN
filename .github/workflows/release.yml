# Publishes a GitHub Release whenever a version tag (vX.Y.Z) is pushed.
#
# This validates that the tagged commit builds, then creates the release
# entry with auto-generated notes. It does not attach an installer - see
# the note in ci.yml about why the native/installer build isn't done here.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SyncVPN.slnx

      - name: Build
        run: dotnet build SyncVPN.slnx -c Release --no-restore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
